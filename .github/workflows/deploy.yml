name: Build & Deployon:  push:    branches: [ master ]env:  REGISTRY: ghcr.io  IMAGE_NAME: ghcr.io/svenxp/gmailfilterjobs:  build-and-push:    runs-on: ubuntu-latest    permissions:      contents: read      packages: write    steps:      - name: Checkout        uses: actions/checkout@v4      - name: Log in to GitHub Container Registry        uses: docker/login-action@v3        with:          registry: ghcr.io          username: ${{ github.actor }}          password: ${{ secrets.GITHUB_TOKEN }}      - name: Build and push Docker image        uses: docker/build-push-action@v5        with:          context: ./GmailEmailFilterManager          push: true          tags: ghcr.io/svenxp/gmailfilter:latest  deploy:    runs-on: ubuntu-latest    needs: build-and-push    steps:      - name: Deploy via SSH        uses: appleboy/ssh-action@v1        with:          host: ${{ secrets.SERVER_IP }}          username: ${{ secrets.SERVER_USER }}          key: ${{ secrets.SSH_KEY }}          script: |            cd ~/docker/gmailemailfiltermanager            docker compose pull            docker compose up -d            docker image prune -f